    <!-- Billboard Ad Manager -->
    <title> Switch Lat and Long </title>
</head>

<body>

    <input type="text" id="input" placeholder="Paste coordinates here">
    <div id="output"></div>
  


    <script>
        function switchLatLong(latLong) {
          return `${latLong.split(', ').reverse().join(',')}`;
        }
    
        async function getClipboardAndSwitch() {
          try {
            const clipboardText = await navigator.clipboard.readText();
            document.getElementById('input').value = clipboardText;
            const outputLatLong = switchLatLong(clipboardText);
    
            // Copy the output to the clipboard
            await navigator.clipboard.writeText(outputLatLong);
    
            // Display the output
            document.getElementById('output').textContent = `${outputLatLong}`;
          } catch (err) {
            console.error('Failed to read clipboard: ', err);
          }
        }
    
        // Automatically get clipboard and switch coordinates when the page loads
        window.addEventListener('load', getClipboardAndSwitch);
      </script>
