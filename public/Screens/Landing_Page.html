<body class="Non_Drag_Image">
  <img src="../Media/Landing_Page_Images/1.jpeg" class="Non_Drag_Image Background_Image" id="BackgroundImageID"
    alt="Background Image">

  <div class="Background_Video_Container">
    <video class="Background_Video" id="Background_Video_ID" autoplay muted loop>
      <source src="../Media/TimeLapse/US_City_1.mp4" type="video/mp4">


    </video>
  </div>

  <div id="Parent_Landing_Page_Text_1">
    <p class="Landing_Page_Large_Text">Overview of <span id="Landing_Page_Text_Accent">ALL</span> Billboards on Curacao
    </p>
    <button type="button" class="Button" id="StartBtnLandingPage" onclick="StartBtn()">Start
      ➤</button>
  </div>

  <div id="Parent_Landing_Page_Text_2">
    <p class="Landing_Page_Large_Text">Billboard Ad Manager</p>
    <button type="button" class="Button" id="StartBtnLandingPage" onclick="StartBtn()">Start
      ➤</button>
  </div>

  <img src="../Media/Logo/Logo_3.png" class="Non_Drag_Image" id="LandingPageLogo" onclick="StartBtn()"> </img>


  <div id="ControlDivParent" class="Non_Drag_Image">

    <button type="button" class="Button Landing_Page_Directions_Button" id="PrevBtn" onclick="Previous()"> 🢀</button>
    <button type="button" class="Button Landing_Page_Directions_Button" id="NextBtn" onclick="Next()"> 🢂</button>
    <!-- 🢀 🢂-->

    <div id="LocationParent" class="Button">
      <div id="LocationText"> </div>
      <div class="LandingPageheader2" id="ReachCountText">5,392 <span id="UniqueViewsStaticText"> </span> Unique Views
        <span id="DailyText">/Daily</span>
      </div>

      <span id="ColumnTextDiv">
        <div class="LandingPageheader2 ColumnTextDiv" id="TrafficCongestionText">Traffic Level: <span class="BlueText"
            id="TrafficLevelValueText">High </span> </div> <br>
        <div class="LandingPageheader2 ColumnTextDiv" id="BillboardTypeText">Billboard Type: <span class="BlueText"
            id="BillboardTypeValueText">Digital </span></div>
      </span>
    </div>
    <button type="button" class="Button" id="StartBtnLandingPage" onclick="StartBtn()">Start
      ➤</button>

  </div>

  </img>
